name: Pruebas

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    name: Playwright + pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: |
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Correr la suite
        run: pytest --html=reporte/reporte.html --self-contained-html --junitxml=reporte/junit.xml
      - name: Guardar el reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-de-pruebas
          path: reporte/
